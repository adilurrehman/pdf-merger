# ==================================================
# PDF Merger - Deployment Pipeline
# ==================================================
# Deploys to Cloudflare Workers from main only.
# Runs the full CI workflow first and deploys only if it passes.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger (still runs CI first; deploys only when run on main)

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'

jobs:
  # ==================================================
  # CI GATE
  # ==================================================
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ==================================================
  # DEPLOY TO CLOUDFLARE WORKERS
  # ==================================================
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔑 Check Cloudflare Secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in the production environment"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: ☁️ Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # ==================================================
  # POST-DEPLOYMENT NOTIFICATION
  # ==================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: 📧 Send Success Notification
        if: needs.deploy.result == 'success'
        run: echo "✅ Deployment successful!"

      - name: 📧 Send Failure Notification
        if: needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled'
        run: |
          echo "❌ Deployment did not succeed: ${{ needs.deploy.result }}"
          exit 1
