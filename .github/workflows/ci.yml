# ==================================================
# PDF Merger - CI Pipeline
# ==================================================
# Runs tests, the security audit and a Docker build.
# deploy.yml calls this workflow and only deploys when it passes.

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  # ==================================================
  # BUILD & TEST JOB
  # ==================================================
  build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm test

      - name: 🚀 Test Server Startup
        run: |
          node server.js &
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 1
          done
          echo "Server did not start"
          exit 1

      - name: ☁️ Check Cloudflare Worker Build
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
        env:
          WRANGLER_SEND_METRICS: 'false'

  # ==================================================
  # SECURITY SCAN JOB
  # ==================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔒 Run Security Audit
        run: npm audit --audit-level=high

  # ==================================================
  # DOCKER BUILD JOB (build only, nothing is pushed)
  # ==================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: pdf-merger:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
