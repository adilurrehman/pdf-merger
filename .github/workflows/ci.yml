# ==================================================
# PDF Merger - CI/CD Pipeline
# ==================================================
# This workflow runs on every push and pull request
# to ensure code quality and successful builds

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ==================================================
  # BUILD & TEST JOB
  # ==================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      # Checkout the repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      # Setup Node.js
      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      # Install dependencies
      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps || npm install
      
      # Create .env file for testing
      - name: 🔐 Create Environment File
        run: |
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
          echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env
      
      # Run linting (if configured)
      - name: 🔍 Run Linter
        run: npm run lint --if-present
        continue-on-error: true
      
      # Run tests (if configured)
      - name: 🧪 Run Tests
        run: npm test --if-present
        continue-on-error: true
      
      # Check if server starts successfully
      - name: 🚀 Test Server Startup
        run: |
          timeout 10s node server.js &
          sleep 5
          curl -f http://localhost:3000 || exit 1
        env:
          EMAIL_USER: test@example.com
          EMAIL_PASS: testpassword

  # ==================================================
  # SECURITY SCAN JOB
  # ==================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps || npm install
      
      - name: 🔒 Run Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ==================================================
  # DOCKER BUILD JOB (Optional)
  # ==================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      
      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pdf-merger:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
